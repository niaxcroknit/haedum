<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs>
<clipPath id="sq"><rect width="100" height="100" rx="23"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D6EEFF"/><stop offset=".55" stop-color="#B3D9FF"/><stop offset="1" stop-color="#95C3F7"/></linearGradient>
<radialGradient id="fill" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFD9EC"/><stop offset=".75" stop-color="#E3F7FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
</defs>
<g clip-path="url(#sq)">
<rect width="100" height="100" fill="url(#bg)"/>
<!-- soft foam at bottom -->
<g fill="#fff" opacity=".95">
<circle cx="14" cy="96" r="14"/><circle cx="34" cy="100" r="14"/><circle cx="58" cy="99" r="15"/><circle cx="82" cy="95" r="15"/><circle cx="100" cy="100" r="12"/>
</g>
<!-- big bubble -->
<circle cx="44" cy="50" r="25" fill="url(#fill)" stroke="url(#rim)" stroke-width="2.6"/>
<path d="M29 41a17 17 0 0 1 11-10" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="27.5" cy="48" r="1.9" fill="#fff"/>
<path d="M58 64a17 17 0 0 0 5-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
<!-- medium bubble -->
<circle cx="77" cy="27" r="10" fill="url(#fill)" stroke="url(#rim)" stroke-width="2"/>
<path d="M71 24a6.5 6.5 0 0 1 4-3.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<!-- small bubbles -->
<circle cx="76" cy="60" r="5.5" fill="url(#fill)" stroke="#fff" stroke-width="1.6"/>
<circle cx="74.2" cy="58.2" r="1.2" fill="#fff"/>
<circle cx="22" cy="21" r="4" fill="none" stroke="#fff" stroke-width="1.6"/>
<!-- sparkles -->
<path d="M52 13l1.6 3.8 3.8 1.6-3.8 1.6-1.6 3.8-1.6-3.8-3.8-1.6 3.8-1.6z" fill="#fff"/>
<path d="M88 47l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z" fill="#fff" opacity=".9"/>
</g>
</svg>
